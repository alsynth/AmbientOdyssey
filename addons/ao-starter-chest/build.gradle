plugins {
    id 'java'
    id 'net.neoforged.moddev' version '2.0.148'
}
group = 'dev.ambientodyssey.starterchest'
version = '0.1.0-experimental'
base { archivesName = 'ao-starter-chest' }
java.toolchain.languageVersion = JavaLanguageVersion.of(21)
repositories { maven { url = 'https://maven.shadowsoffire.dev/releases' } }
dependencies {
    implementation('dev.shadowsoffire:Apotheosis:1.21.1-8.9.0') { transitive = false }
    implementation('dev.shadowsoffire:Placebo:1.21.1-9.9.2') { transitive = false }
    implementation('dev.shadowsoffire:ApothicAttributes:1.21.1-2.11.0') { transitive = false }
}
neoForge {
    version = '21.1.252'
    mods { ao_starter_chest { sourceSet sourceSets.main } }
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
