plugins {
    id 'net.neoforged.moddev' version '2.0.42-beta'
}

version = project.mod_version
group = 'dev.ambientodyssey'
base { archivesName = 'ao-questlog-betterinventory' }

repositories { mavenCentral() }

neoForge {
    version = project.neoforge_version
    mods {
        "aoquestlogbridge" { sourceSet sourceSets.main }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}
java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}
processResources {
    def props = ["version": project.version]
    inputs.properties(props)
    filesMatching("META-INF/neoforge.mods.toml") { expand props }
}
jar {
    manifest { attributes('Implementation-Title': 'Ambient Odyssey Questlog Better Inventory Bridge', 'Implementation-Version': project.version) }
}
