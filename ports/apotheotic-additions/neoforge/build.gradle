plugins {
    id 'java'
    id 'net.neoforged.moddev' version '2.0.148'
}
group = 'dev.ambientodyssey.ports.apotheotic'
version = '0.0.1-source-prototype'
base { archivesName = 'ao-apotheotic-port-prototype' }
java.toolchain.languageVersion = JavaLanguageVersion.of(21)
repositories { maven { url = 'https://maven.shadowsoffire.dev/releases' } }
repositories { maven { url = 'https://maven.blamejared.com' } }
dependencies {
    implementation('dev.shadowsoffire:Apotheosis:1.21.1-8.9.0') { transitive = false }
    implementation('dev.shadowsoffire:Placebo:1.21.1-9.9.2') { transitive = false }
    implementation('dev.shadowsoffire:ApothicAttributes:1.21.1-2.11.0') { transitive = false }
    // The installed pack includes Patchouli; include it so the stock Chronicle recipe also validates.
    runtimeOnly('vazkii.patchouli:Patchouli:1.21.1-93-NEOFORGE') { transitive = false }
}
neoForge {
    version = '21.1.252'
    mods { ao_apotheotic_port { sourceSet sourceSets.main } }
    runs {
        gameTestServer {
            type = 'gameTestServer'
            systemProperty 'neoforge.enabledGameTestNamespaces', 'ao_apotheotic_port'
        }
    }
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
tasks.named('jar') { from('LICENSE.AFL-3.0'); from('NOTICE.md') }

// A loader crash can exit successfully before any GameTests run. Require actual evidence.
tasks.named('runGameTestServer') {
    doFirst { project.ext.apotheoticTestStarted = System.currentTimeMillis() }
    doLast {
        def evidence = file('run/logs/latest.log')
        if (!evidence.exists() || evidence.lastModified() < project.ext.apotheoticTestStarted ||
                !evidence.text.contains('All 11 required tests passed :)') ||
                evidence.text.contains('Failed to start the minecraft server')) {
            throw new GradleException('Native Apotheotic tests did not produce eleven fresh passing results; inspect run/logs/latest.log')
        }
    }
}
