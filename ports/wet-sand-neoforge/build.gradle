plugins {
    id 'java'
    id 'net.neoforged.moddev' version '2.0.148'
}
group = 'dev.ambientodyssey.ports.wetsand'
version = '0.0.1-source-prototype'
base { archivesName = 'ao-wet-sand-prototype' }
java.toolchain.languageVersion = JavaLanguageVersion.of(21)
// Optional, disposable integration snapshot. Never points at or modifies a live profile by default.
if (project.hasProperty('aoRuntimeMods')) {
    dependencies { runtimeOnly fileTree(dir: project.property('aoRuntimeMods'), include: ['*.jar']) }
}
neoForge {
    version = '21.1.252'
    mods { ao_wet_sand { sourceSet sourceSets.main } }
    runs {
        clientSmoke {
            client()
            gameDirectory = project.file('build/client-smoke-runtime')
            systemProperty 'ao_wet_sand.clientSmoke', 'true'
            systemProperty 'ao_wet_sand.clientSmokeTimeoutSeconds', project.findProperty('aoClientSmokeTimeoutSeconds') ?: '120'
            if (project.hasProperty('aoClientSmokeHeap')) {
                jvmArgument "-Xmx${project.property('aoClientSmokeHeap')}"
            }
            programArguments.addAll('--width', '480', '--height', '270')
        }
        gameTestServer {
            type = 'gameTestServer'
            gameDirectory = project.file(project.hasProperty('aoRuntimeMods') ? 'run-terrain' : 'run')
            systemProperty 'neoforge.enabledGameTestNamespaces', 'ao_wet_sand'
            if (project.hasProperty('aoPersistencePhase')) {
                systemProperty 'ao_wet_sand.persistencePhase', project.property('aoPersistencePhase')
                gameDirectory = project.file('build/persistence-runtime')
            }
        }
    }
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
tasks.named('jar') { from('LICENSE'); from('NOTICE.md') }
