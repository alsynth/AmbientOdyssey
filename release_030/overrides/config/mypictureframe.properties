# Configuracion de My Picture Frame

# Mostrar mensaje de Patreon en el chat al ingresar (true/false)
enable_patreon_message=true

# Activar lista blanca de dominios para imagenes (true/false)
enable_whitelist=false

# Dominios permitidos separados por comas (ej. imgur.com,discordapp.com)
allowed_domains=

# Solo operadores pueden crear/editar marcos (true/false)
require_op_only=false

# Distancia de renderizado maxima de marcos (en bloques)
max_render_distance=64

# Limite maximo de marcos que un jugador normal puede colocar
max_frames_per_player=3

# Quien puede subir imagenes locales para que el servidor las comparta (all/op/none)
local_image_permission=op

# Tamano maximo por imagen local subida, en MB
max_local_image_mb=8

# Total maximo de MB que un mismo jugador puede tener almacenado en el servidor
max_local_image_quota_mb=64
