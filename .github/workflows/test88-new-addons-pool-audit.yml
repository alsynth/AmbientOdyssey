name: Test8.8 new addons jigsaw completeness scan
on:
  push:
    branches: [worldgen/test8.8-complete-pool-repair]
    paths: ['.github/workflows/test88-new-addons-pool-audit.yml']
  workflow_dispatch:
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install nbtlib==2.0.4
      - name: Check all pinned later additions not just original Test6 source list
        run: |
          python - <<'PY'
          import concurrent.futures,gzip,io,urllib.request,urllib.parse,zipfile,collections,json
          from pathlib import Path
          import nbtlib
          l=json.loads(Path('release_030/release-lock.json').read_text())
          from collections import Counter
          additions={k:v for k,v in l['additions'].items() if v.get('fileName','').endswith('.jar')}
          # 1.21.1 binary and datapack assets are checked; aliases are not guessed.
          def audit(pair):
              slug,a=pair
              fid=a['id'];fname=a['fileName']
              url=f'https://mediafilez.forgecdn.net/files/{fid//1000}/{fid%1000:03d}/'+urllib.parse.quote(fname)
              try:
                  with urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'AmbientOdyssey-NewModsAudit/1.0'}),timeout=55) as response:buf=response.read(65000000)
                  data=[];count=0
                  with zipfile.ZipFile(io.BytesIO(buf)) as z:
                      for path in z.namelist():
                          if '/structure/' not in path or not path.startswith('data/') or not path.endswith('.nbt'):continue
                          count+=1
                          try:
                              plain=gzip.decompress(z.read(path))
                              if b'\x00\x0aminecraft:' not in plain or b'jigsaw' not in plain:continue
                              doc=nbtlib.File.parse(io.BytesIO(plain))
                              for b in doc['blocks']:
                                  if str(doc['palette'][int(b['state'])]['Name'])!='minecraft:jigsaw':continue
                                  tag=b.get('nbt',{})
                                  if str(tag.get('pool',''))=='minecraft:':
                                      data.append({'template':path,'pos':list(map(int,b['pos'])),'target':str(tag.get('target',''))})
                          except Exception as e:
                              print('NBT_PARSE_ERROR',slug,path,type(e).__name__,str(e)[:100],flush=True)
                  return (slug,count,data,None)
              except Exception as e:
                  return (slug,0,[],type(e).__name__+':'+str(e)[:120])
          print('ADDITION_JARS_TO_CHECK',len(additions),flush=True)
          results=[]
          with concurrent.futures.ThreadPoolExecutor(max_workers=8) as ex:
              for row in ex.map(audit,additions.items()):
                  results.append(row)
                  if row[2]:print('NEW_ADDON_INVALID_TERMINAL',row[0],'NBTs',row[1],'examples',json.dumps(row[2][:20]),flush=True)
                  elif row[3]:print('ADDON_SOURCE_UNREADABLE',row[0],row[3],flush=True)
          print('COVERAGE_SUMMARY',json.dumps({'jars_attempted':len(results),'checked_nbts':sum(r[1] for r in results),'invalid_terminal_connectors':sum(len(r[2]) for r in results),'unreadable_jars':[r[0] for r in results if r[3]],'owners':{r[0]:len(r[2]) for r in results if r[2]}}),flush=True)
          PY
