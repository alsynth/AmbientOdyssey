name: AO v0.4.3 Hominid-Free Stability Private CurseForge Test
on:
  push:
    branches:
      - experimental/v043-hominid-free-questlog-stability-20261011
  workflow_dispatch:
concurrency:
  group: ao-v043-stability-${{ github.ref_name }}
  cancel-in-progress: true
permissions:
  contents: read
  actions: read
jobs:
  worldgen-addon:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '9.2.1'}
      - name: Verify Hominid is removed from addon source, preserve Tan and Dungeon Crawl
        run: python tools/validate_v041_worldgen_safety.py
      - name: Native compile Hominid-free AO worldgen safety 0.1.4
        run: |
          gradle -p addons/ao-worldgen-safety --no-daemon --stacktrace build || (sleep 20; gradle -p addons/ao-worldgen-safety --no-daemon --stacktrace build)
          test -f addons/ao-worldgen-safety/build/libs/ao-worldgen-safety-0.1.4-experimental.jar
          ! unzip -l addons/ao-worldgen-safety/build/libs/ao-worldgen-safety-0.1.4-experimental.jar | grep -Fi 'HominidFinalizeSpawnMixin'
          ! unzip -p addons/ao-worldgen-safety/build/libs/ao-worldgen-safety-0.1.4-experimental.jar META-INF/neoforge.mods.toml | grep -F 'modId="hominid"'
          unzip -p addons/ao-worldgen-safety/build/libs/ao-worldgen-safety-0.1.4-experimental.jar ao_worldgen_safety.mixins.json
      - uses: actions/upload-artifact@v4
        with:
          name: AO-v043-Hominid-Free-Worldgen-JAR
          path: addons/ao-worldgen-safety/build/libs/ao-worldgen-safety-0.1.4-experimental.jar
          if-no-files-found: error
  full-private-pack:
    needs: worldgen-addon
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.10.2'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Source assertions (no uncontrolled recipe, config, or loot edits)
        run: |
          python tools/validate_v041_worldgen_safety.py
          python tools/validate_v041_questlog_native_tab.py
          python -m unittest discover -s tests -p 'test_v042_spellstone_difficulty.py' -v
          python -m unittest discover -s tests -p 'test_v042_recipe_bridge.py' -v
      - name: Compile Questlog settings-right native tab v0.1.4
        run: |
          gradle -p addons/ao-questlog-betterinventory --no-daemon build || (sleep 20; gradle -p addons/ao-questlog-betterinventory --no-daemon build)
          test -f addons/ao-questlog-betterinventory/build/libs/ao-questlog-betterinventory-0.1.4.jar
      - uses: actions/download-artifact@v4
        with:
          name: AO-v043-Hominid-Free-Worldgen-JAR
          path: build/ao-v043-addons
      - name: Retrieve EXACT prior successful 0.4.2 combined ZIP, no rollback modifications
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p build/previous
          gh run download 38152215903 --repo "$GITHUB_REPOSITORY" --name AO-v042-SPELLSTONE-DIFFICULTY-COMBINED-PRIVATE-CurseForge-Import --dir build/previous
          test -f build/previous/Ambient-Odyssey-v0.4.2-SPELLSTONE-DIFFICULTY-COMBINED-TEST.zip
          echo 'd4f928aec66c9dceea275b71db299a871cdac1ba9d07c83f91bb20c2a9b32be3  build/previous/Ambient-Odyssey-v0.4.2-SPELLSTONE-DIFFICULTY-COMBINED-TEST.zip' | sha256sum -c -
      - name: Build full v0.4.3 private CurseForge import ZIP and verify byte-preserved history
        run: |
          python tools/package_v043_stability.py \
            --base build/previous/Ambient-Odyssey-v0.4.2-SPELLSTONE-DIFFICULTY-COMBINED-TEST.zip \
            --quest addons/ao-questlog-betterinventory/build/libs/ao-questlog-betterinventory-0.1.4.jar \
            --safety build/ao-v043-addons/ao-worldgen-safety-0.1.4-experimental.jar \
            --output build/Ambient-Odyssey-v0.4.3-HOMINID-FREE-STABILITY-TEST.zip
          python tools/package_v043_stability.py \
            --base build/previous/Ambient-Odyssey-v0.4.2-SPELLSTONE-DIFFICULTY-COMBINED-TEST.zip \
            --quest addons/ao-questlog-betterinventory/build/libs/ao-questlog-betterinventory-0.1.4.jar \
            --safety build/ao-v043-addons/ao-worldgen-safety-0.1.4-experimental.jar \
            --output build/Ambient-Odyssey-v0.4.3-HOMINID-FREE-STABILITY-TEST.zip --verify
          python tools/perf_preflight_v04.py build/Ambient-Odyssey-v0.4.3-HOMINID-FREE-STABILITY-TEST.zip --expected-refs 330 --output build/v043-perf-static-preflight.json
          sha256sum build/Ambient-Odyssey-v0.4.3-HOMINID-FREE-STABILITY-TEST.zip
          git diff --check
      - name: Upload exact v0.4.3 standalone CurseForge ZIP
        uses: actions/upload-artifact@v4
        with:
          name: AO-v043-HOMINID-FREE-STABILITY-PRIVATE-TEST
          path: |
            build/Ambient-Odyssey-v0.4.3-HOMINID-FREE-STABILITY-TEST.zip
            build/v043-perf-static-preflight.json
            docs/testing/V043_HOMINID_FREE_STABILITY_TEST.md
          if-no-files-found: error
