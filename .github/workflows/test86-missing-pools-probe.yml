name: Test8.6 remaining jigsaw source metadata probe
on:
  push:
    branches: [worldgen/test8.6-generation-repairs]
    paths: ['.github/workflows/test86-missing-pools-probe.yml']
  workflow_dispatch:
jobs:
  inspect:
    runs-on: ubuntu-latest
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Index angler sources, candidate packs, and mod-binary URLs
        run: |
          python - <<'PY'
          import gzip, json, zipfile, urllib.request
          from pathlib import Path
          root=Path('release_030')
          x=json.loads(gzip.decompress((root/'evidence/jar-resource-index-test6.json.gz').read_bytes()))
          print('JAR_INDEX_SAMPLE',json.dumps(x['jars'][:5])[:4500],flush=True)
          print('INDEX_RESOURCE_TYPES',len(x['resources']),list(x['resources'])[:24],flush=True)
          pool=x['resources'].get('worldgen/template_pool',{})
          print('POOL_NAMESPACE_COUNTS',sorted({k.split(':')[0] for k in pool}),flush=True)
          for k,entries in pool.items():
            if 'angler' in k:
              print('ANGLER_NATIVE',k,json.dumps(entries)[:12500],flush=True)
          lock=json.loads((root/'release-lock.json').read_text())
          base=Path(lock['baseline'])
          with zipfile.ZipFile(base) as z:
              m=json.loads(z.read('manifest.json'))
              print('BASE_MANIFEST_FILE_COUNT',len(m['files']),flush=True)
          # Probe known official metadata by exact fileID, to enable native NBT provider search without guessing file URLs
          ids=[6344382,8983496,6584803]
          urls=[]
          for ident in ids:
              urls.extend([f'https://api.curse.tools/v1/cf/minecraft/mods/files/{ident}',f'https://api.cfwidget.com/files/{ident}'])
          for url in urls:
              try:
                req=urllib.request.Request(url,headers={'User-Agent':'AmbientOdyssey-WorldgenAudit/1.0','Accept':'application/json'})
                with urllib.request.urlopen(req,timeout=10) as r:
                  buf=r.read(300000).decode(errors='replace')
                print('API_OK',url,'head',buf[:550],flush=True)
              except Exception as ex:
                print('API_ERROR',url,type(ex).__name__,str(ex)[:200],flush=True)
          PY
