name: AO v0.4.6 Wet Sand and Apotheotic Additions Port Preflight
on:
  push:
    branches:
      - experimental/v046-wetsand-apotheotic-ports-20261011
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ao-v046-ports-${{ github.ref_name }}
  cancel-in-progress: true
jobs:
  wet-sand-neoforge:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '9.2.1'}
      - name: Compile isolated native Wet Sand registration prototype
        run: |
          gradle -p ports/wet-sand-neoforge --no-daemon --stacktrace build
          test -f ports/wet-sand-neoforge/build/libs/ao-wet-sand-prototype-0.0.1-source-prototype.jar
          unzip -p ports/wet-sand-neoforge/build/libs/ao-wet-sand-prototype-0.0.1-source-prototype.jar META-INF/neoforge.mods.toml | grep -F 'modId="ao_wet_sand"'
      - name: Check prototype resources are in JAR
        run: |
          for STAGE in moist_sand wet_sand soaked_sand moist_red_sand wet_red_sand soaked_red_sand; do
            unzip -l ports/wet-sand-neoforge/build/libs/ao-wet-sand-prototype-0.0.1-source-prototype.jar | grep -F "assets/ao_wet_sand/blockstates/$STAGE.json"
            unzip -l ports/wet-sand-neoforge/build/libs/ao-wet-sand-prototype-0.0.1-source-prototype.jar | grep -F "assets/ao_wet_sand/models/block/$STAGE.json"
            unzip -l ports/wet-sand-neoforge/build/libs/ao-wet-sand-prototype-0.0.1-source-prototype.jar | grep -F "assets/ao_wet_sand/models/item/$STAGE.json"
          done
      - name: Run native NeoForge Wet Sand mechanics GameTests
        run: gradle -p ports/wet-sand-neoforge --no-daemon --stacktrace runGameTestServer
      - name: Verify packaged art, models and license notices
        run: python tools/validate_v046_wetsand_resources.py ports/wet-sand-neoforge/build/libs/ao-wet-sand-prototype-0.0.1-source-prototype.jar
      - name: Save treasure in first server process
        run: |
          gradle -p ports/wet-sand-neoforge --no-daemon --stacktrace -PaoPersistencePhase=write runGameTestServer
          cp ports/wet-sand-neoforge/build/persistence-runtime/logs/latest.log ports/wet-sand-neoforge/build/persistence-write.log
      - name: Verify saved treasure in second server process
        run: |
          gradle -p ports/wet-sand-neoforge --no-daemon --stacktrace -PaoPersistencePhase=read runGameTestServer
          cp ports/wet-sand-neoforge/build/persistence-runtime/logs/latest.log ports/wet-sand-neoforge/build/persistence-read.log
      - name: Native client model and texture startup check
        run: |
          if ! command -v xvfb-run >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y xvfb
          fi
          timeout 180s xvfb-run -a gradle -p ports/wet-sand-neoforge --no-daemon --stacktrace runClientSmoke
          grep -F 'WETSAND_CLIENT_SMOKE_PASS' ports/wet-sand-neoforge/build/client-smoke-runtime/logs/latest.log
          ! grep -F 'WETSAND_CLIENT_SMOKE_FAIL' ports/wet-sand-neoforge/build/client-smoke-runtime/logs/latest.log
      - name: Preserve mechanics evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AO-v046-WETSAND-GAMETEST-EVIDENCE
          if-no-files-found: warn
          path: |
            ports/wet-sand-neoforge/run/logs/
            ports/wet-sand-neoforge/build/reports/
            ports/wet-sand-neoforge/build/persistence-runtime/logs/
            ports/wet-sand-neoforge/build/persistence-*.log
            ports/wet-sand-neoforge/build/client-smoke-runtime/logs/
      - uses: actions/upload-artifact@v4
        with:
          name: AO-v046-WETSAND-SOURCE-PROTOTYPE-NOT-FOR-PACK
          if-no-files-found: error
          path: ports/wet-sand-neoforge/build/libs/ao-wet-sand-prototype-0.0.1-source-prototype.jar
  apotheotic-native-materials:
    needs: wet-sand-neoforge
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '9.2.1'}
      - name: Compile three isolated Apotheotic crafting material registries
        run: |
          gradle -p ports/apotheotic-additions/neoforge --no-daemon --stacktrace build
          test -f ports/apotheotic-additions/neoforge/build/libs/ao-apotheotic-port-prototype-0.0.1-source-prototype.jar
          unzip -p ports/apotheotic-additions/neoforge/build/libs/ao-apotheotic-port-prototype-0.0.1-source-prototype.jar META-INF/neoforge.mods.toml | grep -F 'modId="ao_apotheotic_port"'
      - name: Validate all three disabled rarity definitions
        run: |
          python - <<'PY'
          import json, pathlib
          folder=pathlib.Path("ports/apotheotic-additions/neoforge/src/main/resources/data/ao_apotheotic_port/rarities")
          expectations={"artifact":8,"heirloom":4,"esoteric":16}
          for name,total in expectations.items():
              data=json.loads((folder/(name+".json")).read_text())
              assert data["type"]=="apotheosis:rarity"
              assert len(data["rules"])==total
              assert all(v["weight"]==0 for v in data["weights"].values())
              assert data["material"]=="ao_apotheotic_port:"+name+"_material"
          print("PASS: all three prototype rarities structurally present; disabled from drops")
          PY
      - name: Verify native rarity registry, materials, rolls, components and reload
        run: gradle -p ports/apotheotic-additions/neoforge --no-daemon --stacktrace runGameTestServer
      - name: Preserve Apotheotic rarity evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AO-v046-APOTHEOTIC-RARITY-GAMETEST-EVIDENCE
          if-no-files-found: warn
          path: |
            ports/apotheotic-additions/neoforge/run/logs/
            ports/apotheotic-additions/neoforge/build/reports/
      - uses: actions/upload-artifact@v4
        with:
          name: AO-v046-APOTHEOTIC-MATERIALS-SOURCE-PROTOTYPE-NOT-FOR-PACK
          if-no-files-found: error
          path: ports/apotheotic-additions/neoforge/build/libs/ao-apotheotic-port-prototype-0.0.1-source-prototype.jar
  apotheotic-schema-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Fetch exact upstream source, no legacy JAR injection
        run: |
          git clone --depth 1 --branch main https://github.com/Bryce792/ApotheoticAdditions.git build/upstream-apotheotic
          git -C build/upstream-apotheotic rev-parse HEAD > build/apotheotic-upstream-sha.txt
      - name: Run fail-closed affix schema migration audit
        run: |
          python -m py_compile ports/apotheotic-additions/port_schema_probe.py
          python ports/apotheotic-additions/port_schema_probe.py build/upstream-apotheotic/data/apotheotic_additions build/apotheotic-migration-report.json
          python ports/apotheotic-additions/rarity_preview.py build/upstream-apotheotic/data/apotheotic_additions build/apotheotic-rarity-preview.json
          python ports/apotheotic-additions/boss_compat_audit.py build/upstream-apotheotic/data/apotheotic_additions build/apotheotic-boss-inventory.json
          python - <<'PY'
          import json
          d=json.load(open('build/apotheotic-migration-report.json'))
          assert not d["port_complete"] and not d["ready_to_install"]
          assert sum(d['type_counts'].values())>100
          print('PASS: detailed schema report; no legacy data in current pack')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: AO-v046-APOTHEOTIC-DATA-MIGRATION-AUDIT
          if-no-files-found: error
          path: |
            build/apotheotic-migration-report.json
            build/apotheotic-upstream-sha.txt
            build/apotheotic-rarity-preview.json
            build/apotheotic-boss-inventory.json
