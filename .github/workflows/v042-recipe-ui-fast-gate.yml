name: AO v0.4.2 15 Native Recipes and Q Geometry Fast Gate
on:
  push:
    branches:
      - experimental/v042-recipes-nbt-spawner-ui-repair-20261011
  workflow_dispatch:
permissions: {contents: read}
concurrency: {group: ao-v042-restorations-static, cancel-in-progress: true}
jobs:
  sources:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Original codec transformations and narrow replacement tests
        run: |
          python -m py_compile tools/audit_v042_native_recipes.py tools/generate_v042_minecells_recipes.py tools/validate_v042_restorations_zip.py
          python -m unittest discover -s tests -p test_v042_recipe_bridge.py -v
          python tools/validate_v041_questlog_native_tab.py
          python tools/validate_v041_worldgen_safety.py
      - name: Retrieve exact Mine Cells pinned JAR and generate only 15 NeoForge recipes
        run: |
          python -u tools/generate_v042_minecells_recipes.py
          python -u tools/generate_v042_minecells_recipes.py --check
          python tools/validate_v041_six_fix.py
          python -m unittest discover -s tests -p test_v042_history_gates.py -v
          git diff --check
      - uses: actions/upload-artifact@v4
        with:
          name: AO-v042-15-Native-Recipe-Validation
          path: build/v042-minecells-recipe-migration.json
          if-no-files-found: error
