name: Ambient Odyssey v0.4h Q1 Questlog 50-quest experimental ZIP
on:
  push:
    branches: [experimental/v0.4h-questbook-q1-20261010]
  workflow_dispatch:
jobs:
  q1:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install nbtlib==2.0.4
      - name: Authoring graph, source pins and content/worldgen regressions
        run: |
          python -m compileall -q tools build_release_030.py
          python tools/validate_v04_quest_campaign.py
          python tools/validate_v04_questlog.py
          python tools/validate_v04_fg.py
          python validate_content_040a.py
          python validate_content_040b.py
          python validate_content_040c.py
          python validate_content_040d.py
          python validate_content_040e.py
          python validate_worldgen_test84.py
          python validate_generation_repairs_086.py
          python validate_worldgen_089.py
          python validate_worldgen_810.py
          python compile_terminal_jigsaws_087.py
      - name: Package private modpack with installed Questlog campaign
        run: |
          python build_release_030.py --private-modrinth --output build/Ambient-Odyssey-v0.4h-Q1-Questbook-PRIVATE.zip
          python tools/validate_v04_release.py build/Ambient-Odyssey-v0.4h-Q1-Questbook-PRIVATE.zip --private --report build/q1-private-validation.json
          python tools/diagnose_v04_instance.py --zip build/Ambient-Odyssey-v0.4h-Q1-Questbook-PRIVATE.zip --report build/q1-private-diagnostic.json
      - name: Reproducible rebuild and CurseForge reference-only ZIP
        run: |
          python build_release_030.py --private-modrinth --output build/q1-repeat.zip
          cmp build/Ambient-Odyssey-v0.4h-Q1-Questbook-PRIVATE.zip build/q1-repeat.zip
          python build_release_030.py --output build/Ambient-Odyssey-v0.4h-Q1-Questbook-CF-References.zip
          python tools/validate_v04_release.py build/Ambient-Odyssey-v0.4h-Q1-Questbook-CF-References.zip --report build/q1-reference-validation.json
          python tools/preflight_v04.py build/Ambient-Odyssey-v0.4h-Q1-Questbook-CF-References.zip --require-minecells
          python tools/diagnose_v04_instance.py --zip build/Ambient-Odyssey-v0.4h-Q1-Questbook-CF-References.zip --report build/q1-reference-diagnostic.json
          git diff --check
      - uses: actions/upload-artifact@v4
        with:
          name: Ambient-Odyssey-v04h-Q1-QUESTBOOK-EXPERIMENTAL
          path: |
            build/Ambient-Odyssey-v0.4h-Q1-Questbook-PRIVATE.zip
            build/Ambient-Odyssey-v0.4h-Q1-Questbook-CF-References.zip
            build/q1-*-validation.json
            build/q1-*-diagnostic.json
            docs/questing/QUESTLOG_Q1_IMPLEMENTATION.md
            docs/questing/QUESTLOG_Q1_RUNTIME_TESTS.md
          compression-level: 0
          if-no-files-found: error
