name: '0.4c wildlife installed-JAR English mob roster'
on:
  push:
    branches: [content/0.4.0c-feedback-ecology-rules]
    paths: ['.github/workflows/content040c-wildlife-native-jars.yml']
  workflow_dispatch:
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Inspect native 1.21.1 entity translations and spawn definitions
        run: |
          python - <<'PY'
          import urllib.request,urllib.parse,json,io,zipfile,re,concurrent.futures,hashlib
          projects={
           'hybrid_aquatic':(834427,'hybrid_aquatic-neoforge-1.21.1-1.7.4.jar'),
           'bens_sharks':(987388,'benssharks-1.2.6-neoforge-1.21.1.jar'),
           'ftb_ocean_mobs':(1197859,'ftboceanmobs-21.1.4.jar'),
           'friendsandfoes':(602059,'friendsandfoes-neoforge-4.0.27+mc1.21.1.jar'),
           'mowzies_mobs':(250498,'mowziesmobs-1.21.1-1.8.2.jar'),
           'aquaculture':(60028,'Aquaculture-1.21.1-2.7.21.jar'),
           'hominid':(1221597,'hominid-1.3.4.jar'),
           'naturalist':(627986,'naturalist-2.0.5-neoforge-1.21.1.jar'),
          }
          def go(pair):
           slug,(pid,filename)=pair
           try:
            req=urllib.request.Request('https://api.cfwidget.com/'+str(pid),headers={'User-Agent':'AmbientOdyssey-0.4c-Native-Entity-Audit/1.0'})
            with urllib.request.urlopen(req,timeout=50) as f:obj=json.loads(f.read(3200000))
            f=next((x for x in obj.get('files',[]) if x.get('name')==filename),None)
            if not f:return (slug,{'error':'exact file missing from project','project':pid,'filename':filename,'candidates':[x.get('name') for x in obj.get('files',[]) if '1.21.1' in x.get('name','')][:15]})
            fid=f['id']
            url=f'https://mediafilez.forgecdn.net/files/{fid//1000}/{fid%1000:03d}/'+urllib.parse.quote(filename)
            with urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'AmbientOdyssey-Source-Validation/1.0'}),timeout=90) as d:b=d.read(60000000)
            with zipfile.ZipFile(io.BytesIO(b)) as z:
             langs=[]
             for n in z.namelist():
              if n.endswith('/lang/en_us.json'):
               try: langs += [(k,v) for k,v in json.loads(z.read(n)).items() if k.startswith('entity.')]
               except Exception: pass
             loots=[n.split('/')[-1][:-5] for n in z.namelist() if '/loot_table/entities/' in n and n.endswith('.json')]
             spawnfiles=[n for n in z.namelist() if ('biome_modifier' in n or 'spawn' in n.lower()) and n.endswith('.json')][:80]
             return slug,{'file_id':fid,'name':filename,'sha':hashlib.sha256(b).hexdigest(),'entity_labels':sorted(langs),'loot_entity_names':sorted(set(loots)),'spawn_data_paths':spawnfiles}
           except Exception as e:return slug,{'error':type(e).__name__+': '+str(e)[:250]}
          with concurrent.futures.ThreadPoolExecutor(max_workers=8) as ex:
           for slug,out in ex.map(go,projects.items()):
            print('WILDLIFE_NATIVE',slug,json.dumps(out,ensure_ascii=False)[:33000],flush=True)
          PY
