name: AO v0.4.1 Mine Cells Structure Placement Control ZIP
on:
  push:
    branches:
      - experimental/v0.4.1-minecells-structure-control-20261011
  workflow_dispatch:
permissions:
  contents: read
jobs:
  structure-control:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install nbtlib==2.0.4
      - name: Validate unchanged 331-ref Trek Six-Fix questbook source
        run: |
          python -m compileall -q build_release_030.py tools
          python tools/validate_v041_six_fix.py
          python tools/validate_v04_trek_curated.py
          python tools/validate_v04_ftb_manual.py
          python tools/validate_v04_quest_campaign.py
          python tools/validate_v04_questlog.py
          python tools/validate_v04_fg.py
      - name: Build and validate unmodified baseline
        run: |
          python build_release_030.py --output build/AO-v041-combined-reference.zip
          python tools/validate_v04_release.py build/AO-v041-combined-reference.zip
          python tools/validate_v04_trek_curated.py --archive build/AO-v041-combined-reference.zip
          python tools/preflight_v04.py build/AO-v041-combined-reference.zip --require-minecells
      - name: Derive and validate standalone Mine Cells structure-control import ZIP
        run: |
          python tools/make_v041_minecells_structure_control.py build/AO-v041-combined-reference.zip build/Ambient-Odyssey-v0.4.1-MINECELLS-STRUCTURE-CONTROL-TEST.zip
          python tools/make_v041_minecells_structure_control.py --verify build/Ambient-Odyssey-v0.4.1-MINECELLS-STRUCTURE-CONTROL-TEST.zip --baseline build/AO-v041-combined-reference.zip
          python tools/preflight_v04.py build/Ambient-Odyssey-v0.4.1-MINECELLS-STRUCTURE-CONTROL-TEST.zip --require-minecells
          sha256sum build/Ambient-Odyssey-v0.4.1-MINECELLS-STRUCTURE-CONTROL-TEST.zip
          git diff --check
      - uses: actions/upload-artifact@v4
        with:
          name: AO-v041-MineCells-Structure-Control-Import
          path: build/Ambient-Odyssey-v0.4.1-MINECELLS-STRUCTURE-CONTROL-TEST.zip
          if-no-files-found: error
