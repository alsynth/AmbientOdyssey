name: 'Ambient Odyssey 0.4e content-first expansion build'
on:
  push:
    branches: [content/0.4.0e-audit-first-wide-expansion]
    paths:
      - '.github/workflows/content040e-audit-broad-build.yml'
      - 'compile_terminal_jigsaws_087.py'
      - 'build_release_030.py'
      - 'release_030/release-lock.json'
      - 'release_030/structure-compatibility.json'
      - 'compile_compatibility_031.py'
      - 'release_030/overrides/**'
      - 'validate_generation_repairs_086.py'
      - 'validate_worldgen_test84.py'
      - 'validate_worldgen_089.py'
      - 'validate_worldgen_810.py'
      - 'validate_content_040a.py'
      - 'validate_content_040c.py'
      - 'validate_content_040d.py'
      - 'validate_content_040e.py'
  workflow_dispatch:
jobs:
  source-audit-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install nbtlib==2.0.4
      - name: Verify exact two added 0.4.0-e0 pins and retained dependencies
        run: python validate_content_040a.py
      - name: Verify combined wildlife curation, global gamerules and audio config
        run: |
          python validate_content_040c.py
          python validate_content_040d.py
          python validate_content_040e.py
      - name: Verify previous terrain and structure checks retained
        run: |
          python validate_worldgen_test84.py
          python validate_generation_repairs_086.py
      - name: Verify pinned Towns & Towers lighthouse and RS city source against native 1.21.1 binaries
        run: python validate_worldgen_089.py
      - name: Validate Graveyard crypt and Swiss village source-backed fixes
        run: python validate_worldgen_810.py
      - name: Verify exact pinned native 273 repairs independent of package build
        run: python compile_terminal_jigsaws_087.py
      - name: Produce 308 pinned CF mods and identical private NeoReef archive
        run: python build_release_030.py --private-modrinth --output build/Ambient-Odyssey-0.4.0-e0-World-Rules-Wildlife-AUDIO-PRIVATE.zip
      - name: Re-run baseline and structure checks after compilation
        run: |
          python validate_worldgen_test84.py
          python validate_generation_repairs_086.py
      - name: Reverify 0.4.0-e0 source aliases after builder
        run: python validate_worldgen_810.py
      - name: Reverify 8.9 source overrides after builder
        run: python validate_worldgen_089.py
      - name: Reverify 20 additions and older two QoL entries after compiling sources
        run: |
          python validate_content_040a.py
          python validate_content_040c.py
          python validate_content_040d.py
          python validate_content_040e.py
      - name: Independently parse all 273 archived native NBTs and 1 angler fix
        run: |
          python - <<'PY'
          import hashlib,gzip,io,json,zipfile,collections
          from pathlib import Path
          import nbtlib
          p=Path('build/Ambient-Odyssey-0.4.0-e0-World-Rules-Wildlife-AUDIO-PRIVATE.zip')
          counts=collections.Counter()
          prefix='overrides/config/paxi/datapacks/ao_worldgen_final_fixes/data/'
          with zipfile.ZipFile(p) as z:
              assert z.testzip() is None
              ns=z.namelist()
              assert len(ns)==len(set(ns))
              m=json.loads(z.read('manifest.json'))
              assert m['version']=='0.4.0-e0-audit-broad-content'
              refs={x['projectID']:x['fileID'] for x in m['files']}
              assert len(refs)==308 and refs[1713723]==8988949 and refs[1385782]==7227735
              assert refs[250398]==6368976 and refs[889915]==8909889
              content_mods={360203:8767509,1308987:9039094,1214728:9039106,835687:9099893,714059:6467772,627986:9004373,345854:9032258,342584:9060865,1182393:8390081,958094:9103491,1413643:7384220,870076:9001238,1477733:9116978,1499605:8313373}
              asset_packs={1363585:9092152,1690239:8936929,1321476:8493563,531730:8048795,380413:6021451}
              assert all(refs[k]==v for k,v in content_mods.items())
              assert all(refs[k]==v for k,v in asset_packs.items())
              new_content={852665:7232511,891324:6492670,456956:5813117,538214:6330030,843344:7917189,1199355:8555615,986982:6105085}
              assert all(refs[k]==v for k,v in new_content.items())
              assert refs[841890]==8061947 # Chipped requires Athena
              audit_mods={401648:5873258,351441:6409785,1617531:8740321,325492:5553811,240633:5979614,1023913:7768631,1015155:6294123,532127:6400660,1321830:8507645,502561:6375501,452834:7508749}
              assert all(refs[k]==v for k,v in audit_mods.items())
              assert refs[638111]==6372979 # Legendary Tooltips requires Prism 1.0.11

              assert hashlib.sha1(z.read('overrides/mods/neoreefredux-1.0.jar')).hexdigest()=='10160406202fd3dadd295e130b380466436e0981'
              patched=[n for n in ns if n.startswith(prefix) and n.endswith('.nbt')]
              assert len(patched)==273,(len(patched),patched[:3])
              for f in patched:
                  nbt=nbtlib.File.parse(io.BytesIO(gzip.decompress(z.read(f))))
                  nsname=f[len(prefix):].split('/')[0]
                  count=0
                  for b in nbt['blocks']:
                      if str(nbt['palette'][int(b['state'])]['Name'])!='minecraft:jigsaw':
                          continue
                      t=b.get('nbt',{})
                      assert str(t.get('pool',''))!='minecraft:',f
                      if str(t.get('pool',''))=='minecraft:empty':
                          if nsname=='create_easy_structures':
                              # These two end-caps have valid outgoing targets; only pool changes.
                              if str(t.get('target','')) in ('create_easy_structures:schiene','create_easy_structures:weg'):
                                  count+=1
                          else:
                              assert str(t.get('target',''))!='minecraft:',f
                              if str(t.get('target',''))=='minecraft:empty':
                                  count+=1
                  assert count==1,(f,count)
                  counts[nsname]+=count
              assert dict(counts)=={'adventuredungeons':264,'block_factorys_bosses':1,'irons_spellbooks':6,'create_easy_structures':2},counts
              angler=json.loads(z.read(prefix+'minecraft/worldgen/template_pool/angler_additions_3_pool.json'))
              cook=json.loads(z.read(prefix+'minecraft/worldgen/template_pool/cook_additions_3_pool.json'))
              assert len(angler['elements'])==len(cook['elements'])==9
              assert angler['elements']==cook['elements'] and angler['name']=='minecraft:angler_additions_3_pool'
              city=json.loads(z.read(prefix+'repurposed_structures/worldgen/structure/city_overworld.json'))
              master=json.loads(z.read(prefix+'kaisyn/worldgen/template_pool/village/beach_lighthouse/villager_lighthouse_master.json'))
              stopper=json.loads(z.read(prefix+'kaisyn/worldgen/template_pool/village/beach_lighthouse/villagers/lighthouse_master.json'))
              assert city['size']==7 and city['start_pool']=='repurposed_structures:cities/overworld/start_pool'
              assert master['elements'][0]['element']['location']=='kaisyn:village/beach_lighthouse/villagers/lighthouse_master'
              assert stopper['elements'][0]['element']['element_type']=='minecraft:empty_pool_element'
              bridge=json.loads(z.read('overrides/config/paxi/datapacks/ao_compatibility/data/forge/tags/item/tools.json'))
              assert bridge['replace'] is False and any(v['id']=='#c:tools' for v in bridge['values'])
              small=json.loads(z.read(prefix+'graveyard/worldgen/template_pool/large_walled_graveyard/small_crypt_pool.json'))
              swiss=json.loads(z.read(prefix+'kaisyn/worldgen/template_pool/village/meadow_swiss/villagers.json'))
              assert small['name']=='graveyard:large_walled_graveyard/small_crypt_pool' and len(small['elements'])==1
              assert swiss['name']=='kaisyn:village/meadow_swiss/villagers' and len(swiss['elements'])==3
              rules_root='overrides/config/paxi/datapacks/ao_server_rules/'
              assert json.loads(z.read(rules_root+'pack.mcmeta'))['pack']['pack_format']==48
              assert json.loads(z.read(rules_root+'data/minecraft/tags/function/load.json'))['values']==['ambient_odyssey:server_rules']
              commands=z.read(rules_root+'data/ambient_odyssey/function/server_rules.mcfunction').decode()
              for command in ['gamerule playersSleepingPercentage 30','gamerule doFireTick false','gamerule mobGriefing false']:
                  assert command in commands
              assert 631098 not in refs and refs[835687]==9099893
              wave=z.read('overrides/config/waves-common.toml').decode()
              assert 'waveVolume = 0.25' in wave and 'waveBreakingSoundChance = 120' in wave
              defaults=z.read('overrides/config/defaultoptions/options.txt').decode()
              assert 'soundCategory_weather:0.2' in defaults and 'soundCategory_block:0.4' in defaults
              mutant=z.read('overrides/config/mutantmonsters-common.toml').decode()
              for key in ('mutant_creeper_spawn_weight','mutant_enderman_spawn_weight','mutant_skeleton_spawn_weight','mutant_zombie_spawn_weight'):
                  assert key+' = 0.01' in mutant
              am=z.read('overrides/config/alexsmobs.toml').decode()
              for mob in ('gorilla','fly','cockroach'):
                  assert mob+'SpawnWeight = 0' in am
              print('INDEPENDENT VERIFIED: 273 NBT fixes; 1 angler JSON; 308 CF refs; NeoReef checksum; ZIP CRC and manifest')
              print('PATCHED STRUCTURE NBT COUNTS:',dict(counts))
          print('ZIP SIZE',p.stat().st_size,'SHA256',hashlib.sha256(p.read_bytes()).hexdigest())
          print('No in-game Minecraft runtime was used. Resource packs are CF platform references; verify CF installer puts them in the resourcepacks folder and enables desired layering.')
          PY
      - name: Rebuild deterministically from cached pinned sources and compare exact ZIP bytes
        run: |
          python build_release_030.py --private-modrinth --output build/Ambient-Odyssey-0.4.0-e0-World-Rules-Wildlife-AUDIO-PRIVATE-repeat.zip
          python - <<'PY'
          from pathlib import Path
          import hashlib
          a=Path('build/Ambient-Odyssey-0.4.0-e0-World-Rules-Wildlife-AUDIO-PRIVATE.zip').read_bytes()
          b=Path('build/Ambient-Odyssey-0.4.0-e0-World-Rules-Wildlife-AUDIO-PRIVATE-repeat.zip').read_bytes()
          assert a==b, 'Different bytes from identical source-locked inputs'
          print('BIT-FOR-BIT REPRODUCIBILITY PASS',len(a),hashlib.sha256(a).hexdigest())
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: Ambient-Odyssey-0.4.0-e0-PRIVATE-273-Terminal-Jigsaw-Repairs
          path: build/Ambient-Odyssey-0.4.0-e0-World-Rules-Wildlife-AUDIO-PRIVATE.zip
          retention-days: 7
          compression-level: 0
          if-no-files-found: error
