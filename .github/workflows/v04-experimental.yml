name: Ambient Odyssey v0.4 experimental release validation
on:
  push:
    branches: [experimental/v0.4-complete-20261010]
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install nbtlib==2.0.4
      - name: Content and worldgen regressions
        run: |
          python validate_content_040a.py
          python validate_content_040b.py
          python validate_content_040c.py
          python validate_content_040d.py
          python validate_content_040e.py
          python validate_worldgen_test84.py
          python validate_generation_repairs_086.py
          python validate_worldgen_089.py
          python validate_worldgen_810.py
          python compile_terminal_jigsaws_087.py
      - name: Complete private experimental ZIP
        run: |
          python build_release_030.py --private-modrinth --output build/Ambient-Odyssey-v0.4-Experimental-MineCells-PRIVATE.zip
          python tools/validate_v04_release.py build/Ambient-Odyssey-v0.4-Experimental-MineCells-PRIVATE.zip --private --report build/private-validation.json
      - name: Deterministic repeat and reference-only export
        run: |
          python build_release_030.py --private-modrinth --output build/repeat.zip
          cmp build/Ambient-Odyssey-v0.4-Experimental-MineCells-PRIVATE.zip build/repeat.zip
          python build_release_030.py --output build/Ambient-Odyssey-v0.4-Experimental-MineCells-CF-References.zip
          python tools/validate_v04_release.py build/Ambient-Odyssey-v0.4-Experimental-MineCells-CF-References.zip --report build/reference-validation.json
          python tools/preflight_v04.py build/Ambient-Odyssey-v0.4-Experimental-MineCells-CF-References.zip --require-minecells
      - uses: actions/upload-artifact@v4
        with:
          name: Ambient-Odyssey-v04-EXPERIMENTAL
          path: |
            build/Ambient-Odyssey-v0.4-Experimental-MineCells-PRIVATE.zip
            build/Ambient-Odyssey-v0.4-Experimental-MineCells-CF-References.zip
            build/*-validation.json
          compression-level: 0
          if-no-files-found: error
