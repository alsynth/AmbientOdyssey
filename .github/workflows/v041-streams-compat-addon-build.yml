name: AO v0.4.1 experimental Streams Mine Cells addon build
on:
  push:
    branches:
      - experimental/v041-streams-minecells-code-audit-20261011
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-compat-addon:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - name: Compile and package NeoForge compatibility addon
        run: gradle -p compat/streams-minecells clean build --no-daemon --stacktrace
      - name: Verify output metadata
        run: |
          unzip -p compat/streams-minecells/build/libs/*.jar META-INF/neoforge.mods.toml | grep -F ao_streams_minecells
          unzip -p compat/streams-minecells/build/libs/*.jar ao_streams_minecells.mixins.json | grep -F StreamsChunkDeferralMixin
          sha256sum compat/streams-minecells/build/libs/*.jar
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: AO-v041-Streams-MineCells-Experimental-Addon-JAR
          path: compat/streams-minecells/build/libs/*.jar
          if-no-files-found: error
