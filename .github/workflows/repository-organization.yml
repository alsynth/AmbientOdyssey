name: Ambient Odyssey Repository Organization Safety
on:
  push:
    branches: [maintenance/repo-organization-20261010]
  workflow_dispatch:
jobs:
  organization:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install nbtlib==2.0.4
      - name: Verify archive blobs, links and unchanged Q1 content
        run: |
          python tools/validate_repo_organization.py
          python tools/validate_v04_quest_campaign.py
          python tools/validate_v04_ftb_manual.py
          python tools/validate_v04_questlog.py
          python tools/validate_v04_fg.py
          git diff --check
      - name: Build the same reference-only CurseForge ZIP and check exact old hash
        run: |
          python build_release_030.py --output build/Ambient-Odyssey-Repo-Organization-Reference-Only.zip
          echo 'c4b7fa1595a4aa99f6cc9a504266c5acaf6518c7a47b67186cc69473a6fbd88b  build/Ambient-Odyssey-Repo-Organization-Reference-Only.zip' | sha256sum -c -
          python tools/validate_v04_release.py build/Ambient-Odyssey-Repo-Organization-Reference-Only.zip --report build/organization-reference-validation.json
          python tools/preflight_v04.py build/Ambient-Odyssey-Repo-Organization-Reference-Only.zip --require-minecells
      - uses: actions/upload-artifact@v4
        with:
          name: AO-Repository-Organization-Evidence
          path: |
            docs/archive/ARCHIVE_MANIFEST.json
            build/organization-reference-validation.json
            docs/maintainers/REPO_MAP.md
          if-no-files-found: error
