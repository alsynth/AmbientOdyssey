name: Ambient Odyssey 0.4.1 unified test ZIP
on:
  push:
    branches: [experimental/v0.4.1-six-fix-test-20261010]
  workflow_dispatch:
jobs:
  build-v041:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install nbtlib==2.0.4
      - name: Source checks
        run: |
          python -m compileall -q tools build_release_030.py
          python tools/validate_v041_six_fix.py
          python tools/validate_v04_fg.py
          python tools/validate_v04_questlog.py
          python tools/validate_v04_quest_campaign.py
          python tools/validate_v04_ftb_manual.py
          python validate_content_040a.py
          python validate_content_040b.py
          python validate_content_040c.py
          python validate_content_040d.py
          python validate_content_040e.py
          python validate_worldgen_test84.py
          python validate_generation_repairs_086.py
          python validate_worldgen_089.py
          python validate_worldgen_810.py
          python compile_terminal_jigsaws_087.py
      - name: Single combined CurseForge ZIP
        run: |
          python build_release_030.py --output build/Ambient-Odyssey-v0.4.1-SIX-FIX-TEST.zip
          python tools/validate_v04_release.py build/Ambient-Odyssey-v0.4.1-SIX-FIX-TEST.zip --report build/v041-validation.json
          python tools/preflight_v04.py build/Ambient-Odyssey-v0.4.1-SIX-FIX-TEST.zip --require-minecells
          python tools/diagnose_v04_instance.py --zip build/Ambient-Odyssey-v0.4.1-SIX-FIX-TEST.zip --report build/v041-diagnostic.json
          python build_release_030.py --output build/repeat.zip
          cmp build/Ambient-Odyssey-v0.4.1-SIX-FIX-TEST.zip build/repeat.zip
          sha256sum build/Ambient-Odyssey-v0.4.1-SIX-FIX-TEST.zip > build/v041-sha256.txt
          git diff --check
      - uses: actions/upload-artifact@v4
        with:
          name: Ambient-Odyssey-v041-SIX-FIX-TEST
          path: |
            build/Ambient-Odyssey-v0.4.1-SIX-FIX-TEST.zip
            build/v041-validation.json
            build/v041-diagnostic.json
            build/v041-sha256.txt
            V041_SIX_FIX_TEST.md
          compression-level: 0
          if-no-files-found: error
