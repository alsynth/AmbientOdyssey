name: 'AO 0.4b candidate identities and dependencies'
on:
  push:
    branches: [content/0.4.0b-large-content-wave]
    paths: ['.github/workflows/content040b-filedetails.yml']
  workflow_dispatch:
jobs:
  lookup:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@v4
      - name: Resolve ambiguous mod files and assess actual JAR dependencies
        run: |
          python - <<'PY'
          import urllib.request,urllib.parse,json,concurrent.futures,io,zipfile,tomllib,re
          projects={
           'guard_villagers':360203,'villager_names':345854,'collective':342584,
           'foxified':1413643,'polytone':958094,'atmosfera':1499605,
           'ambient_sounds':254284,'easy_core':1308987,'easy_ui':1214728,
           'cosy':1182393,'betterarch':835687,'galosphere':631098
          }
          picks={
           'guard_villagers':8767509,'villager_names':8021602,
           'easy_core':9039094,'easy_ui':9039106,'cosy':8390081,
           'betterarch':9099893,'galosphere':8242886,'atmosfera':8313373
          }
          data={}
          def get(pair):
           slug,pid=pair
           try:
            with urllib.request.urlopen(urllib.request.Request(f'https://api.cfwidget.com/{pid}',headers={'User-Agent':'AmbientOdyssey-Content-0.4b/1.0'}),timeout=35) as r:
             p=json.loads(r.read(2500000))
            arr=p.get('files',[])
            if slug in picks:
             f=next((x for x in arr if x.get('id')==picks[slug]),None)
            else:f=None
            return slug,pid,arr,f
           except Exception as e:
            return slug,pid,[],{'error':str(e)}
          with concurrent.futures.ThreadPoolExecutor(max_workers=10) as ex:
           for slug,pid,arr,found in ex.map(get,projects.items()):
            data[slug]=(pid,arr,found)
            sample=[{'id':f['id'],'name':f.get('name','')} for f in arr if f.get('name','')][:12]
            print('META',slug,'selected',json.dumps(found)[:1200],'TOP',json.dumps(sample)[:2200],flush=True)
          for slug,(pid,arr,selected) in data.items():
           if not isinstance(selected,dict) or 'id' not in selected:continue
           fid=selected['id'];name=selected['name']
           url=f'https://mediafilez.forgecdn.net/files/{fid//1000}/{fid%1000:03d}/'+urllib.parse.quote(name)
           try:
            with urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'AmbientOdyssey-Content-Binary-Preflight/1.0'}),timeout=45) as r:buf=r.read(45000000)
            with zipfile.ZipFile(io.BytesIO(buf)) as z:
             metas=[p for p in z.namelist() if p.endswith('neoforge.mods.toml') or p.endswith('mods.toml') or p.endswith('fabric.mod.json')]
             parsed=[]
             for name in metas:
              text=z.read(name).decode(errors='replace')
              if name.endswith('.toml'):
               try:
                j=tomllib.loads(text)
                parsed.append({'path':name,'mod_ids':[m.get('modId') for m in j.get('mods',[])],'dependencies':j.get('dependencies',{}),'modproperties':str(j.get('modproperties',{}))[:1000]})
               except Exception as e:parsed.append({'path':name,'error':str(e)[:100],'raw_dependencies':[s for s in text.splitlines() if 'modId' in s or 'mandatory' in s or 'versionRange' in s][:60]})
              else:
               try:
                j=json.loads(text)
                parsed.append({'path':name,'modid':j.get('id'),'depends':j.get('depends')})
               except Exception as e:parsed.append({'error':str(e)})
             print('JAR_METADATA',slug,fid,'size',len(buf),'files',len(z.namelist()),'mods',json.dumps(parsed)[:6000],flush=True)
           except Exception as e:print('JAR_ERROR',slug,fid,type(e).__name__,str(e)[:230],flush=True)
          PY
