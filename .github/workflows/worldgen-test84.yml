name: Ambient Odyssey Test8.4 worldgen verification

on:
  push:
    branches:
      - worldgen/test8.4-prefreeze
    paths:
      - '.github/workflows/worldgen-test84.yml'
      - 'release_030/**'
      - 'compile_worldgen_031.py'
      - 'compile_structure_density_031.py'
      - 'compile_compatibility_031.py'
      - 'compile_structure_repairs_031.py'
      - 'build_release_030.py'
      - 'validate_worldgen_test84.py'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out exact experimental candidate
        uses: actions/checkout@v4
        with:
          lfs: false
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Assert targeted worldgen state before generation
        run: python validate_worldgen_test84.py
      - name: Build authoritative CurseForge import
        run: python build_release_030.py
      - name: Verify generation remained consistent
        run: python validate_worldgen_test84.py
      - name: Run continued baseline regressions
        run: python validate_continuation_031.py --archive build/Ambient-Odyssey-v0.3.1-structure-test5-audit1.zip --report build/test84-continuation.json
      - name: Run Test6 structure regressions
        run: python validate_structure_test6.py --archive build/Ambient-Odyssey-v0.3.1-structure-test5-audit1.zip --report build/test84-structure.json
      - name: Archive integrity + root manifest
        run: |
          python - <<'PY'
          import hashlib, json, zipfile
          from pathlib import Path
          p = Path("build/Ambient-Odyssey-v0.3.1-structure-test5-audit1.zip")
          with zipfile.ZipFile(p) as z:
              assert z.testzip() is None, "archive CRC failure"
              assert "manifest.json" in z.namelist(), "manifest.json missing from root"
              assert len(z.namelist()) == len(set(z.namelist())), "duplicate members"
              manifest = json.loads(z.read("manifest.json"))
              assert manifest["minecraft"]["version"] == "1.21.1"
              assert len(manifest["files"]) >= 250, "unexpected mod-pin loss"
              print("Manifest file refs:", len(manifest["files"]))
          print("SHA256:", hashlib.sha256(p.read_bytes()).hexdigest())
          print("Size:", p.stat().st_size)
          PY
      - name: Upload experimental CI import and scoped checks
        uses: actions/upload-artifact@v4
        with:
          name: AO-Test8.4-EXPERIMENTAL-BUILDER-OUTPUT
          path: |
            build/Ambient-Odyssey-v0.3.1-structure-test5-audit1.zip
            build/test84-continuation.json
            build/test84-structure.json
          if-no-files-found: error
          retention-days: 7
