name: Ambient Odyssey Test8.7 exact-terminal-jigsaw repair validation
on:
  push:
    branches: [worldgen/test8.7-final-jigsaw-cleanup]
    paths:
      - '.github/workflows/test87-jigsaw-cleanup-build.yml'
      - 'compile_terminal_jigsaws_087.py'
      - 'build_release_030.py'
      - 'release_030/release-lock.json'
      - 'release_030/overrides/**'
      - 'validate_generation_repairs_086.py'
      - 'validate_worldgen_test84.py'
  workflow_dispatch:
jobs:
  source-audit-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install nbtlib==2.0.4
      - name: Verify previous terrain and structure checks retained
        run: |
          python validate_worldgen_test84.py
          python validate_generation_repairs_086.py
      - name: Verify exact pinned native 271 repairs independent of package build
        run: python compile_terminal_jigsaws_087.py
      - name: Produce complete 267-project + NeoReef private Test8.7 archive
        run: python build_release_030.py --private-modrinth --output build/Ambient-Odyssey-v0.3.8-Test8.7-Jigsaw-Cleanup-PRIVATE.zip
      - name: Re-run baseline and structure checks after compilation
        run: |
          python validate_worldgen_test84.py
          python validate_generation_repairs_086.py
      - name: Independently parse all 271 archived native NBTs and 1 angler fix
        run: |
          python - <<'PY'
          import hashlib,gzip,io,json,zipfile,collections
          from pathlib import Path
          import nbtlib
          p=Path('build/Ambient-Odyssey-v0.3.8-Test8.7-Jigsaw-Cleanup-PRIVATE.zip')
          counts=collections.Counter()
          prefix='overrides/config/paxi/datapacks/ao_worldgen_final_fixes/data/'
          with zipfile.ZipFile(p) as z:
              assert z.testzip() is None
              ns=z.namelist()
              assert len(ns)==len(set(ns))
              m=json.loads(z.read('manifest.json'))
              assert m['version']=='0.3.8-worldgen-prefreeze-test1.7'
              refs={x['projectID']:x['fileID'] for x in m['files']}
              assert len(refs)==267 and refs[1713723]==8988949 and refs[1385782]==7227735
              assert hashlib.sha1(z.read('overrides/mods/neoreefredux-1.0.jar')).hexdigest()=='10160406202fd3dadd295e130b380466436e0981'
              patched=[n for n in ns if n.startswith(prefix) and n.endswith('.nbt')]
              assert len(patched)==271,(len(patched),patched[:3])
              for f in patched:
                  nbt=nbtlib.File.parse(io.BytesIO(gzip.decompress(z.read(f))))
                  nsname=f[len(prefix):].split('/')[0]
                  count=0
                  for b in nbt['blocks']:
                      if str(nbt['palette'][int(b['state'])]['Name'])!='minecraft:jigsaw':
                          continue
                      t=b.get('nbt',{})
                      assert str(t.get('pool',''))!='minecraft:',f
                      if str(t.get('pool',''))=='minecraft:empty' and str(t.get('target',''))=='minecraft:empty':
                          count+=1
                  assert count==1,(f,count)
                  counts[nsname]+=count
              assert dict(counts)=={'adventuredungeons':264,'block_factorys_bosses':1,'irons_spellbooks':6},counts
              angler=json.loads(z.read(prefix+'minecraft/worldgen/template_pool/angler_additions_3_pool.json'))
              cook=json.loads(z.read(prefix+'minecraft/worldgen/template_pool/cook_additions_3_pool.json'))
              assert len(angler['elements'])==len(cook['elements'])==9
              assert angler['elements']==cook['elements'] and angler['name']=='minecraft:angler_additions_3_pool'
              print('INDEPENDENT VERIFIED: 271 NBT fixes; 1 angler JSON; 267 CF refs; NeoReef checksum; ZIP CRC and manifest')
              print('PATCHED STRUCTURE NBT COUNTS:',dict(counts))
          print('ZIP SIZE',p.stat().st_size,'SHA256',hashlib.sha256(p.read_bytes()).hexdigest())
          print('No in-game Minecraft runtime was used.')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: Ambient-Odyssey-Test8.7-PRIVATE-271-Terminal-Jigsaw-Repairs
          path: build/Ambient-Odyssey-v0.3.8-Test8.7-Jigsaw-Cleanup-PRIVATE.zip
          retention-days: 7
          compression-level: 0
          if-no-files-found: error
